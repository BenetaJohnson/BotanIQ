version: '3.8'

services:
  # Database Service
  db:
    image: postgres:15-alpine
    container_name: botaniq_db
    restart: always
    environment:
      POSTGRES_DB: botaniq
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d botaniq"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend FastAPI API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: botaniq_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/botaniq
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads

  # Frontend Next.js Client Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: botaniq_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
